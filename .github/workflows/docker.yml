name: build cicd pipeline
on:
  push:
    branches:
      - veeresh

jobs:
  build:
    environment: dev
    runs-on: ubuntu-latest
    steps:
       - name: checkout
         uses: actions/checkout@v4
         
       - name: Login to Docker Hub
         uses: docker/login-action@v4
         with:
           username: ${{ vars.DOCKERHUB_USERNAME }}
           password: ${{ secrets.DOCKERHUB_PASS}}
       - name: docker build
         run: docker build -t app:${{ github.run_number }} .

       - name: verify image name
         run: |
           pwd
           ls -ltr
           docker images

       - name: Tag Image
         run: docker tag app:${{ github.run_number }} ${{ vars.DOCKERHUB_USERNAME }}/app:${{ github.run_number }}
         
       - name: docker push
         run: docker push ${{ vars.DOCKERHUB_USERNAME }}/app:${{ github.run_number }}

 ########################################################################################################################################
name: Build and Deploy to EKS
on:
  push:
    branches:
      - veeresh

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - name: Build Docker Image
        run: |
          docker build -t app:${{ github.run_number }} .

      - name: Tag Image
        run: |
          docker tag app:${{ github.run_number }} \
          ${{ vars.DOCKERHUB_USERNAME }}/app:${{ github.run_number }}

      - name: Push Image
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/app:${{ github.run_number }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::262046511657:role/ksd-cicd-role
          aws-region: ap-south-1

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name ksd-eks

      - name: Deploy to EKS
        run: |
          kubectl create deployment app \
            --image=${{ vars.DOCKERHUB_USERNAME }}/app:${{ github.run_number }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Expose Service
        run: |
          kubectl expose deployment app \
            --type=LoadBalancer \
            --port=80 \
            --target-port=80 \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Verify Deployment
        run: |
          kubectl get pods
          kubectl get deployments
          kubectl get svc
        
  
