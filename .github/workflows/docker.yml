name: build cicd pipeline
on:
  push:
    branches:
      - veeresh

jobs:
  build:
    environment: dev
    runs-on: ubuntu-latest
    steps:
       - name: checkout
         uses: actions/checkout@v4
         
       - name: Login to Docker Hub
         uses: docker/login-action@v4
         with:
           username: ${{ vars.DOCKERHUB_USERNAME }}
           password: ${{ secrets.DOCKERHUB_PASS}}
       - name: docker build
         run: docker build -t app:${{ github.run_number }} .

       - name: verify image name
         run: |
           pwd
           ls -ltr
           docker images

       - name: Tag Image
         run: docker tag app:${{ github.run_number }} ${{ vars.DOCKERHUB_USERNAME }}/app:${{ github.run_number }}
         
       - name: docker push
         run: docker push ${{ vars.DOCKERHUB_USERNAME }}/app:${{ github.run_number }}
       
        
  
