#trigger - 2
name: Kubernetes Deployment

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deployment-kubernetes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          role-to-assume: arn:aws:iam::262046511657:role/ksd-cicd-role
         
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
           username: ${{ vars.DOCKERHUB_USERNAME }}
           password: ${{ secrets.DOCKERHUB_PASS}}
           
      - name: docker build
        run: docker build -t app:${{ github.run_number }} .

      - name: verify image name
        run: |
           pwd
           ls -ltr
           docker images

      - name: Tag Image
        run: docker tag app:${{ github.run_number }} ${{ vars.DOCKERHUB_USERNAME }}/app:${{ github.run_number }}
         
      - name: docker push
        run: docker push ${{ vars.DOCKERHUB_USERNAME }}/app:${{ github.run_number }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name ksd-eks-v2

      - name: Debug
        run: kubectl create deployment app --image=${{ vars.DOCKERHUB_USERNAME }}/app:${{ github.run_number }}
